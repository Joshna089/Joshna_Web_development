<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
</head>

<body>
    <h1>CSS Introduction</h1>

    <dl>
        <!-- inline css style is applied to defination term -->
        <dt style="color:burlywood;background-color: brown;">CSS</dt>
        <dd>CSS stands for "Cascading Style Sheets".</dd>

        <!-- inline css style is applied to defination term -->
        <dt style="color:yellow;background-color: yellowgreen;">Purpose </dt>
        <dd>1. CSS is used to style and layout web pages.</dd>
        <dd>2. CSS can control the color, font, spacing, and positioning of elements on a web page.</dd>
    </dl>
    <!-- inline css style is applied to paragraph tag-->
    <p style="color:purple;background-color: thistle;">This is a simple CSS- HTML looks beautiful and structured.</p>
</body>

</html>
