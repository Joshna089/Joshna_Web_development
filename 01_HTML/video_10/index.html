<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video, Audio and Media</title>
</head>

<body>
    <h1>Audio</h1>
    <audio src="audio_1.mp3" controls></audio>
    <h1>Video </h1>
    <video src="video_1.mp4" controls height="300"></video>
    <h1>iframe Tag</h1>
    
    <h2>i frame using website link</h2>
    <iframe src="https://codewithharry.com" frameborder="0" width="470" height="300" ></iframe>
    <h2>i frame using embed feature</h2>
    <iframe src="https://www.youtube.com/embed/8pDqJVdNa44" frameborder="0" width="470" height="300" allowfullscreen></iframe>
    
</body>

</html>
