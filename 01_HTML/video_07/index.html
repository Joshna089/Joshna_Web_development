<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <form action="#">
        <h1>Form for Sigma webdev- TA</h1>
        <!--  The label for = input of id (should be same -When we click on label we can see cursor at input. -->
        <!-- 'for' in label must match 'id' in input -->
        <!-- 'name' attribute = sends data to server with this key. -->
        <!--name = name, dob, gender, course, skils will be sent to server -->
        <div>
            <label for="name">Enter your name :</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">
        </div>

        <div>
            <label for="email">Enter your email :</label>
            <input type="email" name="email" id="email" placeholder="Enter your email">
        </div>

        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" name="dob" id="dob">
        </div>

        <div>
            <!-- same name different id's -->
            <!-- due to same name only one option get selected  -->
            <label> Gender :</label>
            <input type="radio" name="gender" id="Male">
            <label for="Male">Male</label>
            <input type="radio" name="gender" id="Female">
            <label for="Female">Female</label>
        </div>
        
        <div>

            <!-- select use name="course" so any one value can be sent to server  -->
            <label for="course">Select your course:</label>
            <select name="course" id="course">
                <option value="MEC">MEC </option>
                <option value="EEE">EEE</option>
                <option value="Civil">Civil</option>
                <option value="ECE">ECE</option>
                <option value="CSE">CSE</option>
            </select>
        </div>
        
        <div>
            <!-- All checkboxes use same name="skills" so multiple values can be sent to server  -->
            <label>Skills :</label>
            <input type="checkbox" name="skills" id="Python">
            <label for="Python">Python</label>
            <input type="checkbox" name="skills" id="C_Programming">
            <label for="C_Programming">C Programming</label>
            <input type="checkbox" name="skills" id="Java_Script">
            <label for="Java Script">Java Script</label>
            <input type="checkbox" name="skills" id="Java">
            <label for="Java">Java</label>
            <input type="checkbox" name="skills" id="My_SQL">
            <label for="My_SQL">My SQL</label>
        </div>

        <div>
            <label for="message">Message :</label>
        </div>

        <div>
            <!-- <textarea> tag should be closed without gap in middle. -->
            <textarea name="message" id="message" rows="6" cols="30" placeholder="enter your comment here"></textarea>
        </div>

        <!-- <input type="button" value="Send">   Not prefered because it is only button clickable but don't submit form-->
        <input type="submit" value="Submit" id="submit" >
    </form>

    <script src="script.js"></script>
</body>

</html>
